packages:
  - apps/*
  - packages/*
  - workers/*

# Security patches for transitive deps whose parent hasn't released an update.
# Both arrive via `prisma` (a devDependency) -> @prisma/dev, and both stay
# within their current major, so the override is a patch/minor bump.
overrides:
  # GHSA: find-my-way DDoS with HTTP2 (high).
  find-my-way: '>=9.7.0'
  # GHSA: record() issue paths make flatten() throw on inherited Object
  # property names (moderate).
  valibot: '>=1.4.2'

onlyBuiltDependencies:
  - /
  - '@'
  - '@prisma/engines'
  - a
  - e
  - esbuild
  - g
  - i
  - m
  - msgpackr-extract
  - msw
  - n
  - p
  - prisma
  - r
  - s
  - sharp
