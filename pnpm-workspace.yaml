packages:
  - apps/*
  - packages/*
  - workers/*

# Security patches for transitive deps whose parent hasn't released an update.
# Both arrive via `prisma` (a devDependency) -> @prisma/dev, and both stay
# within their current major, so the override is a patch/minor bump.
overrides:
  # GHSA: find-my-way DDoS with HTTP2 (high).
  find-my-way: '>=9.7.0'
  # GHSA: record() issue paths make flatten() throw on inherited Object
  # property names (moderate).
  valibot: '>=1.4.2'

# Packages allowed to run install scripts. Keep this a list of real package
# names — it started life as the scalar `onlyBuiltDependencies: '@prisma/engines'`,
# and when pnpm rewrote it as a list it spread that string into its individual
# characters, leaving eleven junk entries that matched nothing.
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - msgpackr-extract
  - msw
  - prisma
  - sharp
