services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bookhouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bookhouse}
      POSTGRES_DB: ${POSTGRES_DB:-bookhouse}
    volumes:
      - pgdata:/var/lib/postgresql/data

  queue:
    image: valkey/valkey:9
    restart: unless-stopped
    volumes:
      - queuedata:/data

  web:
    image: ghcr.io/beforetheshoes/bookhouse-web:${BOOKHOUSE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookhouse}:${POSTGRES_PASSWORD:-bookhouse}@db:5432/${POSTGRES_DB:-bookhouse}
      QUEUE_URL: redis://queue:6379
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_OIDC_ISSUER: ${AUTH_OIDC_ISSUER}
      AUTH_OIDC_CLIENT_ID: ${AUTH_OIDC_CLIENT_ID}
      AUTH_OIDC_CLIENT_SECRET: ${AUTH_OIDC_CLIENT_SECRET}
      AUTH_OIDC_SCOPES: ${AUTH_OIDC_SCOPES:-openid profile email}
      APP_URL: ${APP_URL}
      COVER_CACHE_DIR: /data/covers
      KEPUB_CACHE_DIR: /data/kepub-cache
      KOBO_API_BASE_URL: ${KOBO_API_BASE_URL:-http://localhost:3000/kobo}
      LOG_DIR: /data/logs
      LOG_SERVICE: web
      # Run the server as this uid:gid so files written into the libraries
      # aren't root-owned. Unset = keep running as root. UMASK=0002 makes
      # created files group-writable (default 0022).
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      UMASK: ${UMASK:-}
    volumes:
      - covers:/data/covers:ro
      - kepub-cache:/data/kepub-cache
      - logs:/data/logs
      - ${EBOOKS_PATH:?set EBOOKS_PATH in .env}:/data/ebooks
      - ${AUDIOBOOKS_PATH:?set AUDIOBOOKS_PATH in .env}:/data/audiobooks
    depends_on:
      - db
      - queue

  worker:
    image: ghcr.io/beforetheshoes/bookhouse-worker:${BOOKHOUSE_TAG:-latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-bookhouse}:${POSTGRES_PASSWORD:-bookhouse}@db:5432/${POSTGRES_DB:-bookhouse}
      QUEUE_URL: redis://queue:6379
      NODE_ENV: production
      COVER_CACHE_DIR: /data/covers
      LOG_DIR: /data/logs
      LOG_SERVICE: worker
      PUID: ${PUID:-}
      PGID: ${PGID:-}
      UMASK: ${UMASK:-}
    volumes:
      - ${EBOOKS_PATH:?set EBOOKS_PATH in .env}:/data/ebooks
      - ${AUDIOBOOKS_PATH:?set AUDIOBOOKS_PATH in .env}:/data/audiobooks
      - covers:/data/covers
      - logs:/data/logs
    depends_on:
      - db
      - queue

volumes:
  pgdata:
  queuedata:
  covers:
  logs:
  kepub-cache:
